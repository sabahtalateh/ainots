<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="320" fill="#ffffff"/>

  <!-- Stage I box -->
  <rect x="20" y="30" width="300" height="80" fill="#eaf5ea" stroke="#3aa03a" stroke-width="2.5" rx="6"/>
  <text x="170" y="60" text-anchor="middle" font-size="16" fill="#3aa03a">&#9312; Формализация задачи</text>
  <text x="170" y="84" text-anchor="middle" font-size="14" fill="#3aa03a">(разметка данных)</text>

  <!-- Stage II box -->
  <rect x="20" y="200" width="300" height="80" fill="#e8f0fa" stroke="#2f6fb0" stroke-width="2.5" rx="6"/>
  <text x="170" y="230" text-anchor="middle" font-size="16" fill="#2f6fb0">&#9313; Выбор алгоритма</text>
  <text x="170" y="254" text-anchor="middle" font-size="14" fill="#2f6fb0">(вид функции f)</text>

  <!-- lines to plus node -->
  <path d="M 320 70 L 460 150" stroke="#3aa03a" stroke-width="2.5" fill="none"/>
  <path d="M 320 240 L 460 160" stroke="#2f6fb0" stroke-width="2.5" fill="none"/>

  <!-- plus node -->
  <circle cx="480" cy="155" r="26" fill="#ffffff" stroke="#e0a72b" stroke-width="3"/>
  <text x="480" y="165" text-anchor="middle" font-size="26" fill="#e0a72b">+</text>

  <!-- arrow to model -->
  <path d="M 508 155 L 600 155" stroke="#e0a72b" stroke-width="3" marker-end="url(#arrowgold)"/>

  <!-- Модель oval -->
  <ellipse cx="710" cy="155" rx="95" ry="45" fill="#fff8e6" stroke="#e0a72b" stroke-width="2.5"/>
  <text x="710" y="163" text-anchor="middle" font-size="20" fill="#8a6414">Модель</text>

  <defs>
    <marker id="arrowgold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e0a72b"/>
    </marker>
  </defs>
</svg>
