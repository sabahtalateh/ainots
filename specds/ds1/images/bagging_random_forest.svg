<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#777777"/>
    </marker>
    <marker id="aRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- samples column -->
  <g font-size="16">
    <rect x="30" y="30" width="90" height="40" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
    <text x="75" y="55" text-anchor="middle" fill="#2f6fb0">выборка 1</text>
    <rect x="30" y="70" width="90" height="40" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
    <text x="75" y="95" text-anchor="middle" fill="#2f6fb0">выборка 2</text>
    <rect x="30" y="110" width="90" height="40" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
    <text x="75" y="135" text-anchor="middle" fill="#2f6fb0">выборка 3</text>
    <text x="75" y="175" text-anchor="middle" fill="#555555">&#8942;</text>
    <rect x="30" y="200" width="90" height="40" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
    <text x="75" y="225" text-anchor="middle" fill="#2f6fb0">выборка 100</text>
  </g>
  <text x="75" y="255" text-anchor="middle" font-size="13" fill="#555555">разные подвыборки</text>
  <text x="75" y="271" text-anchor="middle" font-size="13" fill="#555555">одних и тех же данных</text>

  <!-- arrows to training -->
  <path d="M 122 50 L 210 50"  stroke="#777777" stroke-width="2" marker-end="url(#aGray)"/>
  <path d="M 122 90 L 210 90"  stroke="#777777" stroke-width="2" marker-end="url(#aGray)"/>
  <path d="M 122 130 L 210 130" stroke="#777777" stroke-width="2" marker-end="url(#aGray)"/>
  <path d="M 122 220 L 210 220" stroke="#777777" stroke-width="2" marker-end="url(#aGray)"/>

  <!-- models column (same algorithm) -->
  <g font-size="15">
    <rect x="215" y="32" width="110" height="36" fill="#fff8e6" stroke="#e0a72b" stroke-width="2" rx="4"/>
    <text x="270" y="55" text-anchor="middle" fill="#8a6414">модель 1</text>
    <rect x="215" y="72" width="110" height="36" fill="#fff8e6" stroke="#e0a72b" stroke-width="2" rx="4"/>
    <text x="270" y="95" text-anchor="middle" fill="#8a6414">модель 2</text>
    <rect x="215" y="112" width="110" height="36" fill="#fff8e6" stroke="#e0a72b" stroke-width="2" rx="4"/>
    <text x="270" y="135" text-anchor="middle" fill="#8a6414">модель 3</text>
    <text x="270" y="175" text-anchor="middle" fill="#555555">&#8942;</text>
    <rect x="215" y="202" width="110" height="36" fill="#fff8e6" stroke="#e0a72b" stroke-width="2" rx="4"/>
    <text x="270" y="225" text-anchor="middle" fill="#8a6414">модель 100</text>
  </g>
  <text x="270" y="258" text-anchor="middle" font-size="13" fill="#555555">одинаковый алгоритм</text>

  <!-- object to predict -->
  <g>
    <rect x="470" y="30" width="150" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="2.5" rx="6"/>
    <text x="545" y="61" text-anchor="middle" font-size="16" fill="#c0392b">новый объект</text>
  </g>
  <path d="M 330 50 C 400 20 420 20 465 45" stroke="#c0392b" stroke-width="1.8" fill="none"/>
  <path d="M 330 90 C 400 40 420 40 465 50" stroke="#c0392b" stroke-width="1.8" fill="none"/>
  <path d="M 330 130 C 400 70 420 60 465 55" stroke="#c0392b" stroke-width="1.8" fill="none" marker-end="url(#aRed)"/>
  <path d="M 330 220 C 420 100 440 70 465 60" stroke="#c0392b" stroke-width="1.8" fill="none"/>

  <!-- predictions -->
  <g font-size="17" fill="#c0392b">
    <path d="M 545 82 C 545 140 700 150 750 165" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#aRed)"/>
    <text x="765" y="170">y&#8321;</text>

    <path d="M 545 82 C 545 190 700 210 750 225" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#aRed)"/>
    <text x="765" y="230">y&#8322;</text>

    <path d="M 545 82 C 545 240 700 270 750 285" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#aRed)"/>
    <text x="765" y="290">y&#8323;</text>

    <text x="765" y="330" fill="#555555">&#8942;</text>

    <path d="M 545 82 C 545 340 700 370 750 385" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#aRed)"/>
    <text x="758" y="390">y&#8321;&#8320;&#8320;</text>
  </g>

  <!-- brace + average -->
  <path d="M 800 160 Q 830 160 830 220 Q 830 250 855 260 Q 830 270 830 300 Q 830 360 800 390"
        stroke="#8a6414" stroke-width="2.5" fill="none"/>
  <text x="880" y="250" text-anchor="middle" font-size="16" fill="#8a6414">среднее</text>
  <text x="880" y="270" text-anchor="middle" font-size="16" fill="#8a6414">значение</text>
  <text x="880" y="290" text-anchor="middle" font-size="16" fill="#8a6414">прогноза</text>
</svg>
