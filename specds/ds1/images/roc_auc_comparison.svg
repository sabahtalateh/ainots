<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="520" fill="#ffffff"/>

  <defs>
    <marker id="rocArrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="100" y1="445" x2="100" y2="55" stroke="#1a1a1a" stroke-width="2" marker-end="url(#rocArrow2)"/>
  <line x1="95" y1="440" x2="505" y2="440" stroke="#1a1a1a" stroke-width="2" marker-end="url(#rocArrow2)"/>

  <line x1="460" y1="436" x2="460" y2="444" stroke="#1a1a1a" stroke-width="2"/>
  <text x="460" y="462" text-anchor="middle" font-size="14" fill="#1a1a1a">1</text>
  <text x="100" y="462" text-anchor="middle" font-size="14" fill="#1a1a1a">0</text>
  <line x1="96" y1="80" x2="104" y2="80" stroke="#1a1a1a" stroke-width="2"/>
  <text x="86" y="85" text-anchor="end" font-size="14" fill="#1a1a1a">1</text>
  <text x="86" y="444" text-anchor="end" font-size="14" fill="#1a1a1a">0</text>

  <text x="300" y="500" text-anchor="middle" font-size="16" fill="#1a1a1a">FPR</text>
  <text x="40" y="260" text-anchor="middle" font-size="16" fill="#1a1a1a" transform="rotate(-90 40 260)">TPR / Recall</text>

  <!-- random baseline -->
  <line x1="100" y1="440" x2="460" y2="80" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="7,5"/>

  <!-- moderate classifier -->
  <path d="M100,440 C130,240 260,130 460,80" stroke="#2f6fb0" stroke-width="3.5" fill="none"/>

  <!-- excellent classifier -->
  <path d="M100,440 C105,100 150,82 460,80" stroke="#3aa03a" stroke-width="3.5" fill="none"/>

  <!-- corner annotation -->
  <text x="112" y="70" font-size="13" fill="#555555">идеальный классификатор (AUC = 1)</text>
  <path d="M108,78 L108,60" stroke="#555555" stroke-width="1.2" stroke-dasharray="2,3"/>
  <path d="M460,78 L108,78" stroke="#555555" stroke-width="1.2" stroke-dasharray="2,3"/>

  <!-- legend -->
  <line x1="560" y1="110" x2="600" y2="110" stroke="#3aa03a" stroke-width="3.5"/>
  <text x="610" y="115" font-size="14.5" fill="#1a1a1a" font-weight="bold">отличный</text>
  <text x="610" y="132" font-size="13" fill="#333333">AUC ≈ 0.91</text>

  <line x1="560" y1="160" x2="600" y2="160" stroke="#2f6fb0" stroke-width="3.5"/>
  <text x="610" y="165" font-size="14.5" fill="#1a1a1a" font-weight="bold">средний</text>
  <text x="610" y="182" font-size="13" fill="#333333">AUC ≈ 0.72</text>

  <line x1="560" y1="210" x2="600" y2="210" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="610" y="215" font-size="14.5" fill="#1a1a1a" font-weight="bold">случайный</text>
  <text x="610" y="232" font-size="13" fill="#333333">AUC = 0.50</text>

  <text x="560" y="280" font-size="12.5" fill="#333333">AUC не зависит от порога —</text>
  <text x="560" y="297" font-size="12.5" fill="#333333">одно число, сравнивающее</text>
  <text x="560" y="314" font-size="12.5" fill="#333333">модели сразу по всем</text>
  <text x="560" y="331" font-size="12.5" fill="#333333">порогам одновременно</text>
</svg>
