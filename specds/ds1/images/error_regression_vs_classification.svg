<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <defs>
    <marker id="aBlack2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
    </marker>
    <marker id="aPurple2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7a3fb3"/>
    </marker>
    <marker id="aBlue2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f6fb0"/>
    </marker>
  </defs>

  <line x1="452" y1="45" x2="452" y2="400" stroke="#dddddd" stroke-width="2"/>

  <!-- LEFT: regression -->
  <text x="45" y="35" font-size="19" fill="#333333" font-weight="bold">Регрессия (прогноз величины)</text>

  <line x1="70" y1="380" x2="70" y2="75" stroke="#1a1a1a" stroke-width="2" marker-end="url(#aBlack2)"/>
  <line x1="70" y1="380" x2="420" y2="380" stroke="#1a1a1a" stroke-width="2" marker-end="url(#aBlack2)"/>
  <text x="55" y="72" font-size="16" fill="#1a1a1a">y</text>
  <text x="428" y="385" font-size="16" fill="#1a1a1a">x</text>

  <path d="M 150 65 Q 100 62 78 78" stroke="#2f6fb0" stroke-width="2" fill="none" marker-end="url(#aBlue2)"/>
  <text x="155" y="68" font-size="14" fill="#1d4d80">непрерывная величина</text>

  <text x="65" y="185" font-size="12" fill="#1d4d80" text-anchor="end">600 001</text>
  <text x="65" y="260" font-size="12" fill="#1d4d80" text-anchor="end">500</text>

  <circle cx="130" cy="220" r="6" fill="#c0392b"/>
  <circle cx="130" cy="250" r="6" fill="#3aa03a"/>

  <circle cx="195" cy="255" r="6" fill="#c0392b"/>
  <circle cx="195" cy="295" r="6" fill="#3aa03a"/>
  <path d="M 218 255 L 218 295" stroke="#e0a72b" stroke-width="2"/>
  <path d="M 212 255 L 224 255" stroke="#e0a72b" stroke-width="2"/>
  <path d="M 212 295 L 224 295" stroke="#e0a72b" stroke-width="2"/>
  <text x="230" y="270" font-size="13" fill="#8a6414">величина</text>
  <text x="230" y="286" font-size="13" fill="#8a6414">ошибки</text>

  <circle cx="360" cy="245" r="6" fill="#c0392b"/>
  <circle cx="360" cy="225" r="6" fill="#3aa03a"/>

  <circle cx="230" cy="110" r="6" fill="#c0392b"/>
  <text x="242" y="115" font-size="13" fill="#1a1a1a">реальное (y)</text>
  <circle cx="230" cy="130" r="6" fill="#3aa03a"/>
  <text x="242" y="135" font-size="13" fill="#1a1a1a">предсказание (p)</text>

  <text x="70" y="410" font-size="14" fill="#333333">ошибка = |y − p| — расстояние между числами</text>

  <!-- RIGHT: classification -->
  <text x="560" y="35" font-size="19" fill="#333333" font-weight="bold">Классификация</text>

  <text x="470" y="155" font-size="14" fill="#333333" text-anchor="end">истинный</text>
  <text x="470" y="171" font-size="14" fill="#333333" text-anchor="end">класс</text>
  <rect x="600" y="130" width="40" height="40" fill="#e0a72b"/>
  <rect x="700" y="130" width="40" height="40" fill="#2f6fb0"/>
  <rect x="800" y="130" width="40" height="40" fill="#c0392b"/>
  <rect x="900" y="130" width="40" height="40" fill="#3aa03a"/>

  <text x="470" y="215" font-size="14" fill="#333333" text-anchor="end">предсказание</text>
  <rect x="600" y="190" width="40" height="40" fill="#e0a72b"/>
  <rect x="700" y="190" width="40" height="40" fill="#2f6fb0"/>
  <rect x="800" y="190" width="40" height="40" fill="#3aa03a"/>
  <rect x="900" y="190" width="40" height="40" fill="#3aa03a"/>

  <text x="620" y="258" font-size="22" fill="#2f8f2f" text-anchor="middle" font-weight="bold">&#10003;</text>
  <text x="720" y="258" font-size="22" fill="#2f8f2f" text-anchor="middle" font-weight="bold">&#10003;</text>
  <text x="820" y="258" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="bold">&#10007;</text>
  <text x="920" y="258" font-size="22" fill="#2f8f2f" text-anchor="middle" font-weight="bold">&#10003;</text>

  <text x="620" y="280" font-size="13" fill="#555555" text-anchor="middle">объект 1</text>
  <text x="720" y="280" font-size="13" fill="#555555" text-anchor="middle">объект 2</text>
  <text x="820" y="280" font-size="13" fill="#555555" text-anchor="middle">объект 3</text>
  <text x="920" y="280" font-size="13" fill="#555555" text-anchor="middle">объект 4</text>

  <path d="M 650 330 L 622 262" stroke="#7a3fb3" stroke-width="2" fill="none" marker-end="url(#aPurple2)"/>
  <text x="655" y="335" font-size="15" fill="#5a2d8a" font-weight="bold">верный ответ</text>

  <path d="M 870 330 L 822 262" stroke="#7a3fb3" stroke-width="2" fill="none" marker-end="url(#aPurple2)"/>
  <text x="875" y="335" font-size="15" fill="#5a2d8a" font-weight="bold">ошибка</text>

  <text x="600" y="402" font-size="13" fill="#333333">ошибка = несовпадение класса</text>
  <text x="600" y="420" font-size="13" fill="#333333">(между классами нет расстояния)</text>
</svg>
