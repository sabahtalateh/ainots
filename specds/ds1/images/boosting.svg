<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>

  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555"/>
    </marker>
    <marker id="aPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a3fb3"/>
    </marker>
  </defs>

  <!-- Обучение -->
  <rect x="30" y="160" width="150" height="56" fill="#fff8e6" stroke="#e0a72b" stroke-width="2.5" rx="6"/>
  <text x="105" y="194" text-anchor="middle" font-size="16" fill="#8a6414">обучение</text>

  <path d="M 182 188 L 250 188" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#aGray)"/>

  <!-- модель -->
  <rect x="256" y="160" width="140" height="56" fill="#e8f0fa" stroke="#2f6fb0" stroke-width="2.5" rx="6"/>
  <text x="326" y="194" text-anchor="middle" font-size="16" fill="#2f6fb0">модель</text>

  <path d="M 398 188 L 466 188" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#aGray)"/>

  <!-- тестирование -->
  <rect x="472" y="160" width="160" height="56" fill="#fdecea" stroke="#c0392b" stroke-width="2.5" rx="6"/>
  <text x="552" y="194" text-anchor="middle" font-size="16" fill="#c0392b">тестирование</text>

  <path d="M 634 188 L 700 188" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#aGray)"/>

  <!-- вопрос об ошибках -->
  <rect x="706" y="130" width="260" height="110" fill="#ffffff" stroke="#555555" stroke-width="2" rx="6"/>
  <text x="836" y="164" text-anchor="middle" font-size="14" fill="#333333">на каких объектах</text>
  <text x="836" y="184" text-anchor="middle" font-size="14" fill="#333333">ошибка больше?</text>
  <text x="836" y="212" text-anchor="middle" font-size="13" fill="#7a3fb3">→ увеличить их вес</text>
  <text x="836" y="230" text-anchor="middle" font-size="13" fill="#7a3fb3">в обучающей выборке</text>

  <!-- loop back -->
  <path d="M 836 244 C 836 320 105 320 105 220"
        stroke="#7a3fb3" stroke-width="2.5" fill="none" marker-end="url(#aPurple)"/>
  <text x="470" y="345" text-anchor="middle" font-size="14" fill="#7a3fb3">повторяем много итераций подряд (один и тот же алгоритм)</text>
</svg>
