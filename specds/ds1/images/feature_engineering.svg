<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="620" fill="#ffffff"/>

  <defs>
    <marker id="aBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fb0"/>
    </marker>
    <marker id="aPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a3fb3"/>
    </marker>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3aa03a"/>
    </marker>
  </defs>

  <!-- chain 1: Дата рождения -> Возраст -> Возрастная группа -->
  <ellipse cx="110" cy="80" rx="90" ry="50" fill="#e8f0fa" stroke="#2f6fb0" stroke-width="2.5"/>
  <text x="110" y="75" text-anchor="middle" font-size="16" fill="#1d4d80">Дата</text>
  <text x="110" y="95" text-anchor="middle" font-size="16" fill="#1d4d80">рождения</text>

  <path d="M 202 70 L 330 55" stroke="#2f6fb0" stroke-width="2.5" fill="none" marker-end="url(#aBlue)"/>
  <text x="335" y="60" font-size="18" fill="#1a1a1a">Возраст (1…100)</text>

  <path d="M 555 55 L 700 55" stroke="#2f6fb0" stroke-width="2.5" fill="none" marker-end="url(#aBlue)"/>
  <text x="705" y="52" font-size="18" fill="#1a1a1a">Возрастная группа:</text>
  <text x="720" y="76" font-size="14" fill="#555555">1 — дети, 2 — подростки,</text>
  <text x="720" y="96" font-size="14" fill="#555555">3 — молодёжь, 4 — зрелые,</text>
  <text x="720" y="116" font-size="14" fill="#555555">5 — пожилые</text>

  <!-- cluster 2: Дата продажи -->
  <ellipse cx="230" cy="330" rx="100" ry="60" fill="#f5eafd" stroke="#7a3fb3" stroke-width="2.5"/>
  <text x="230" y="325" text-anchor="middle" font-size="17" fill="#5a2d8a">Дата</text>
  <text x="230" y="345" text-anchor="middle" font-size="17" fill="#5a2d8a">продажи</text>

  <path d="M 300 285 L 420 220" stroke="#7a3fb3" stroke-width="2" fill="none" marker-end="url(#aPurple)"/>
  <text x="425" y="220" font-size="16" fill="#5a2d8a">день недели → будний / выходной</text>

  <path d="M 310 300 L 420 270" stroke="#7a3fb3" stroke-width="2" fill="none" marker-end="url(#aPurple)"/>
  <text x="425" y="274" font-size="16" fill="#5a2d8a">праздничный день (7 марта, 1 сент…)</text>

  <path d="M 330 335 L 420 335" stroke="#7a3fb3" stroke-width="2" fill="none" marker-end="url(#aPurple)"/>
  <text x="425" y="340" font-size="16" fill="#5a2d8a">сезон</text>

  <path d="M 305 370 L 420 400" stroke="#7a3fb3" stroke-width="2" fill="none" marker-end="url(#aPurple)"/>
  <text x="425" y="405" font-size="16" fill="#5a2d8a">время суток</text>

  <!-- cluster 3: IP-адрес -->
  <ellipse cx="820" cy="330" rx="95" ry="55" fill="#eaf5ea" stroke="#3aa03a" stroke-width="2.5"/>
  <text x="820" y="336" text-anchor="middle" font-size="17" fill="#276b27">IP-адрес</text>

  <path d="M 870 285 L 940 480" stroke="#3aa03a" stroke-width="2" fill="none" marker-end="url(#aGreen)"/>
  <text x="760" y="205" font-size="16" fill="#276b27">VPN? (да/нет)</text>
  <path d="M 810 280 L 790 215" stroke="#3aa03a" stroke-width="2" fill="none" marker-end="url(#aGreen)"/>

  <path d="M 900 310 L 1000 290" stroke="#3aa03a" stroke-width="2" fill="none" marker-end="url(#aGreen)"/>
  <text x="905" y="285" font-size="16" fill="#276b27">страна</text>

  <path d="M 900 345 L 1000 345" stroke="#3aa03a" stroke-width="2" fill="none" marker-end="url(#aGreen)"/>
  <text x="905" y="365" font-size="16" fill="#276b27">город</text>

  <path d="M 760 370 L 660 430" stroke="#3aa03a" stroke-width="2" fill="none" marker-end="url(#aGreen)"/>
  <text x="530" y="450" font-size="16" fill="#276b27">провайдер</text>

  <path d="M 790 380 L 730 470" stroke="#3aa03a" stroke-width="2" fill="none" marker-end="url(#aGreen)"/>
  <text x="600" y="490" font-size="16" fill="#276b27">стаж аккаунта</text>

  <text x="30" y="180" font-size="16" fill="#333333" font-weight="bold">Один сырой признак → несколько новых, более информативных</text>
</svg>
